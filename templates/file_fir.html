{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">File FIR</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="complainant_name" class="form-label">Complainant Name</label>
                        <input type="text" class="form-control" id="complainant_name" name="complainant_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="incident_date" class="form-label">Incident Date</label>
                        <input type="date" class="form-control" id="incident_date" name="incident_date" required>
                    </div>
                    <div class="mb-3">
                        <label for="incident_location" class="form-label">Incident Location</label>
                        <input type="text" class="form-control" id="incident_location" name="incident_location" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Submit FIR</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %} oaksmith 8pm afterdark magic moments orange
